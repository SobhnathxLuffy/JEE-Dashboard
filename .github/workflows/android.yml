name: android-apk

# Builds the Android APK on every push to main (and on demand) and keeps a
# rolling "mobile-latest" GitHub Release so the phone can always download the
# current build:  https://github.com/SobhnathxLuffy/JEE-Dashboard/releases
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "research/**", "qa/**", "download/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static export + Capacitor sync
        run: npm run build:mobile

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish to the mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JEE-Study-debug.apk
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest JEE-Study-debug.apk \
            --title "JEE Study — Android (latest)" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA::7}.

          Install: download → allow 'install from unknown sources' for your browser → open the APK.
          Updates install straight over old versions (same signing key every build).
          Sign-in on the app: Data → Sync → paste the magic link from your email (long-press → Copy link address)."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Study-debug-apk
          path: JEE-Study-debug.apk
